images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.2.1/nixos-lima-v0.2.1-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:748c723b69dbdec40a9acaf78cc9070ae784dcb64b0856ab906efdac822d9abcc65565b8f8dfa4cf8b49cc6c12c372072e83bb5ed9247330a7c22675d9e141ce"

# TODO: with locally-built images.
# images:
#   - location: "./result-aarch64/nixos.qcow2"
#     arch: "aarch64"

mounts:
- location: "~"
  writable: false

portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true

containerd:
  system: false
  user: false

## NOTE: user defined below
memory: 16GiB
disk: 250GiB
ssh:
  forwardAgent: true

# NOTE: to enable desktop
# video:
#   display: default
